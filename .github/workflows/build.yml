name: Build
on:
  push:
    branches: [develop, main, 'codex/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Check dependency review receipts
        run: python3 tools/review-dependency-checksums.py
      - name: Build and qualify both libraries
        run: |
          ./gradlew --no-daemon --no-build-cache clean build verifyJavaConsumer publishAllPublicationsToVerificationRepository
          python3 tools/verify-test-results.py
          ./gradlew --no-daemon -p tools/consumer-kotlin run
          ./gradlew --no-daemon -p tools/consumer-kotlin run -PpomOnly=true
      - name: Check reproducible archives on the same JDK
        run: |
          sha256sum image-comparison*/build/libs/*.jar > /tmp/image-comparison-archives.sha256
          ./gradlew --no-daemon --no-build-cache clean build verifyJavaConsumer publishAllPublicationsToVerificationRepository
          sha256sum --check /tmp/image-comparison-archives.sha256
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unchanged packaged libraries on Java 17
        run: |
          java -Djava.awt.headless=true -cp build/consumers/java:image-comparison/build/libs/image-comparison-4.4.1-SNAPSHOT.jar Java17Consumer
          ./gradlew --no-daemon -p tools/consumer-kotlin run
          ./gradlew --no-daemon -p tools/consumer-kotlin run -PpomOnly=true
          sha256sum --check /tmp/image-comparison-archives.sha256
