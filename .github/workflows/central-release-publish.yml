name: Publish validated release on Central
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new immutable version approved in release-approvals/<version>.json
        required: true
        type: string
      deployment_id:
        description: Exact USER_MANAGED deployment UUID, never a guessed/new deployment
        required: true
        type: string
      organization_secrets_checked:
        description: Maintainer just verified organization visibility and no matching repository/environment overrides (names only)
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH_ONCE for this separately authorized operation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: image-comparison-central-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NuaForma/image-comparison' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: maven-central
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ORGANIZATION_SECRET_SOURCES_CHECKED: ${{ inputs.organization_secrets_checked }}
      IMAGE_COMPARISON_SOURCE_ROOT: ${{ github.workspace }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out current reviewed main policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main, signed source and exact eight-artifact human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/policy.py --version "$RELEASE_VERSION" --review "release-approvals/$RELEASE_VERSION.json"
      - name: Fetch and verify approved public certificate (no private key)
        run: |
          mkdir -p build/release-review
          curl --fail --silent --show-error --proto '=https' --max-time 30 --max-filesize 1048576             'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x74317C6CE9C61B80A2A1C0B40F736E8D598CB08B'             --output build/release-review/public-key.asc
          python3 tools/release/check_public_key.py build/release-review/public-key.asc
      - name: Verify every staged byte/signature/checksum before requesting publication once
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          python3 tools/release/portal.py publish --confirm PUBLISH_ONCE --version "$RELEASE_VERSION" --review "release-approvals/$RELEASE_VERSION.json" --deployment-id "$CENTRAL_DEPLOYMENT_ID" --public-key build/release-review/public-key.asc --output build/release-review/publish.json
      - name: Retain non-executable operation records only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-comparison-central-publish-${{ github.run_id }}
          path: |
            build/release-review/publish.json
          if-no-files-found: error
          retention-days: 14
