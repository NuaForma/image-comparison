name: Distribute reviewed Maven release (Central or Nexus)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new immutable version approved in release-approvals/<version>.json
        required: true
        type: string
      organization_secrets_checked:
        description: Maintainer just verified organization visibility and no matching repository/environment overrides (names only)
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type UPLOAD_ONCE; stable versions stage on Central, prereleases publish immediately to Nexus. Never blindly retry.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: image-comparison-central-release
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'NuaForma/image-comparison' && github.ref == 'refs/heads/main' && inputs.confirmation == 'UPLOAD_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: maven-central
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ORGANIZATION_SECRET_SOURCES_CHECKED: ${{ inputs.organization_secrets_checked }}
      IMAGE_COMPARISON_SOURCE_ROOT: ${{ github.workspace }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out approved main policy and review record
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main, signed source and exact eight-artifact human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/maven_destination.py "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/release/policy.py --version "$RELEASE_VERSION" --review "release-approvals/$RELEASE_VERSION.json"
      - name: Preserve current release policy, then check out the exact approved tagged source
        run: |
          mkdir -p "$RUNNER_TEMP/image-comparison-release-policy"
          cp tools/release/*.py "$RUNNER_TEMP/image-comparison-release-policy/"
          cp "release-approvals/$RELEASE_VERSION.json" "$RUNNER_TEMP/image-comparison-release-review.json"
          SOURCE_COMMIT=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/image-comparison-release-review.json"))["sourceCommit"])')
          git checkout --detach "$SOURCE_COMMIT"
      - name: Select pinned Java 17 publication toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - name: Verify wrapper identity
        run: |
          echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test -x gradlew
      - name: Verify exact unsigned tagged libraries and consumers
        run: |
          ./gradlew --no-daemon --no-build-cache clean build verifyJavaConsumer verifyGroupingConsumer stageLibraries
          python3 tools/verify-test-results.py
          python3 "$RUNNER_TEMP/image-comparison-release-policy/consumers.py" --repository build/verification-repository --version "$RELEASE_VERSION" --output build/release-consumers
      - name: Fetch and verify approved public certificate (no private key)
        run: |
          mkdir -p build/release-review
          curl --fail --silent --show-error --proto '=https' --max-time 30 --max-filesize 1048576             'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x74317C6CE9C61B80A2A1C0B40F736E8D598CB08B'             --output build/release-review/public-key.asc
          python3 "$RUNNER_TEMP/image-comparison-release-policy/check_public_key.py" build/release-review/public-key.asc
      - name: Sign the exact tagged candidate locally
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: python3 "$RUNNER_TEMP/image-comparison-release-policy/sign_local.py" --version "$RELEASE_VERSION"
      - name: Independently verify and assemble a local Maven-layout bundle
        run: |
          python3 "$RUNNER_TEMP/image-comparison-release-policy/bundle.py" --repository build/verification-repository --version "$RELEASE_VERSION" --public-key build/release-review/public-key.asc --output build/release-review/central.zip
      - name: Upload once for validation, never automatically publish
        if: ${{ !contains(inputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          python3 "$RUNNER_TEMP/image-comparison-release-policy/portal.py" upload --confirm UPLOAD_ONCE --version "$RELEASE_VERSION" --review "$RUNNER_TEMP/image-comparison-release-review.json" --public-key build/release-review/public-key.asc --bundle build/release-review/central.zip --bundle-record build/release-review/central.zip.json --output build/release-review/deployment.json
      - name: Publish the reviewed immutable prerelease to Nexus once
        if: ${{ contains(inputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          python3 "$RUNNER_TEMP/image-comparison-release-policy/nexus_publish.py" --confirm UPLOAD_ONCE --version "$RELEASE_VERSION" --review "$RUNNER_TEMP/image-comparison-release-review.json" --public-key build/release-review/public-key.asc --bundle build/release-review/central.zip --bundle-record build/release-review/central.zip.json --output build/release-review/nexus-publication.json
      - name: Retain deployment identity and checksums only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-comparison-central-deployment-${{ github.run_id }}
          path: |
            build/release-review/deployment.json
            build/release-review/nexus-publication.json
          if-no-files-found: warn
          retention-days: 14
